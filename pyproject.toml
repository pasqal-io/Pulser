[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
skip = ["__venv__", "__init__.py"]
src_paths = ["pulser-core", "pulser-simulation"]

[tool.pytest.ini_options]
filterwarnings = [
    # All warnings are turned into errors
    "error",
    # Except these particular warnings, which are ignored
    'ignore:A duration of \d+ ns is not a multiple of:UserWarning',
    'ignore:Usage of `int`s or any non-`str`types as `QubitId`s:DeprecationWarning',
    # Emitted by the latest version of PyTorch (v2.15) on macOS VMs
    # refer to: https://github.com/pytorch/pytorch/issues/202529
    "ignore:.*Apple Paravirtual device that does not support Metal.*:UserWarning",
    ]

[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
select = ["NPY201"]
