name: Release to PyPI

on:
  release:
    types: [published]

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Check out Pulser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade ca-certificates
        # apt doesn't rely on the TLS trust store: packages are checked against
        # checksums in GPG-signed repository indexes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
      - name: Install Python dependencies
        run: |
          # Pinned pip >= 26.2.2 for the eMudhra/emSign CA incident, see https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade pip certifi
          pip install -U setuptools build
      - name: Build packages
        shell: bash
        run: ./.github/scripts/package.sh
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # Allows repeating the action
          attestations: false  # Otherwise an attestation is added to dist/
      - name: Install from TestPyPI
        timeout-minutes: 30
        shell: bash
        run: |
          version="$(head -1 VERSION.txt)"
          until pip install -i https://test.pypi.org/simple/ pulser==$version --extra-index-url https://pypi.org/simple
          do
            echo "Failed to install from TestPyPI, will wait for upload and retry."
            sleep 30
          done
      - name: Test the installation
        # Installs pytest from dev_requirements.txt (in case it has a version specifier)
        run: |
          grep -e pytest dev_requirements.txt | sed 's/ //g' | xargs pip install
          pytest
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # Allows repeating the action
      - name: Confirm deployment
        timeout-minutes: 30
        shell: bash
        run: |
          version="$(head -1 VERSION.txt)"
          until pip download pulser==$version
          do
            echo "Failed to download from PyPI, will wait for upload and retry."
            sleep 30
          done
  check-release:
    needs: deploy
    env:
      # Set Matplotlib backend to fix flaky execution on Windows
      MPLBACKEND: Agg
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out Pulser
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade ca-certificates
        if: ${{ runner.os == 'Linux' }}
        # apt doesn't rely on the TLS trust store: packages are checked against
        # checksums in GPG-signed repository indexes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
      - name: Remove compromised roots from /etc/ssl/cert.pem
        if: ${{ runner.os == 'macOS' }}
        # Built-in curl, git and openssl read this file without checking revocation,
        # see https://emudhra.we-have-a-problem.com/ (macOS workaround).
        run: |
          sudo cp -p /etc/ssl/cert.pem /etc/ssl/cert.pem.bak &&
          sudo awk '/^(###|===) /{skip=0}
            /^=== .*\/CN=(AAA Certificate Services|emSign ECC Root CA - G3)$/{skip=1}
            !skip' /etc/ssl/cert.pem.bak | sudo tee /etc/ssl/cert.pem > /dev/null
      - name: Install Pulser from PyPI
        timeout-minutes: 5
        shell: bash
        run: |
          # Pinned pip >= 26.2.2 for the eMudhra/emSign CA incident, see https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install --upgrade pip certifi
          version="$(head -1 VERSION.txt)"
          until pip install pulser==$version
          do
            echo "Failed to install from PyPI, will wait for upload and retry."
            sleep 30
          done
      - name: Test the installation
        shell: bash
        run: |
          version="$(head -1 VERSION.txt)"
          python -c "import pulser; assert pulser.__version__ == '$version'"
          grep -e pytest dev_requirements.txt | sed 's/ //g' | xargs pip install
          pytest
