# Archives the HTML of a Pulser release docs in the `docs-archive` branch,
# so the Pasqal Doc Portal can show the older versions without downloading
# them from Read the Docs on every build.
name: Archive docs

on:
  release:
    # A final release, or a pre-release changed into one. Pre-releases alone are skipped
    types: [released]

permissions:
  contents: write

concurrency:
  group: docs-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the version
        run: |
          [[ $VERSION =~ ^v[0-9]+(\.[0-9]+)+$ ]] \
            || { echo "Only release versions are archived, like v1.9.1"; exit 1; }

      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          path: source

      - name: Check out the docs archive
        uses: actions/checkout@v4
        with:
          ref: docs-archive
          path: archive

      # Same setup as .readthedocs.yml, so the pages match the ones on Read the Docs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            source/docs/requirements.txt
            source/dev_requirements.txt
            source/pulser-core/rtd_requirements.txt
            source/pulser-simulation/rtd_requirements.txt

      - name: Install the docs dependencies
        working-directory: source
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          pip install \
            -r docs/requirements.txt \
            -r dev_requirements.txt \
            -r pulser-core/rtd_requirements.txt \
            -r pulser-simulation/rtd_requirements.txt

      - name: Build the docs
        working-directory: source
        run: python -m sphinx -W --keep-going -b html -d _build/doctrees docs/source _build/html

      - name: Copy the pages to the archive
        # Only the HTML pages: the portal has its own styles, and images are
        # still loaded from Read the Docs
        run: |
          rm -rf "archive/$VERSION"
          rsync -a --prune-empty-dirs \
            --exclude '/_static/' --exclude '/_images/' \
            --exclude '/_modules/' --exclude '/_sources/' \
            --include '*/' --include '*.html' --exclude '*' \
            source/_build/html/ "archive/$VERSION/"
          test -s "archive/$VERSION/index.html"

      - name: Add the version to versions.json
        # Newest version first, with the `latest` alias like mike: the portal
        # then shows it as latest instead of building it twice
        working-directory: archive
        run: |
          [ -f versions.json ] || echo '[]' > versions.json
          jq --arg version "$VERSION" '
            map(select(.version != $version))
            + [{ version: $version, title: $version }]
            | sort_by(.version | ltrimstr("v") | split(".") | map(tonumber))
            | reverse
            | map(.aliases = [])
            | .[0].aliases = ["latest"]
          ' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

      - name: Commit and push
        working-directory: archive
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Archive the $VERSION docs"
          git push origin HEAD:docs-archive
